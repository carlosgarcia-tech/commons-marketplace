name: CI/CD

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Upload coverage
              uses: codecov/codecov-action@v3
              with:
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false

    build:
        name: Build & Push Docker
        runs-on: ubuntu-latest
        needs: [lint, test, security]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get version
              id: version
              run: |
                  VERSION=$(node -e "console.log(require('./package.json').version)")
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Set image name and tags
              id: image
              run: |
                  IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
                  # Short, sortable tags so 'docker pull' targets are easy to
                  # identify: 20260824-a1b2c3d > a1b2c3d > <version> > latest.
                  SHORT_SHA="$(git rev-parse --short HEAD)"
                  DATE_TAG="$(date -u +%Y%m%d)"
                  echo "name=$IMAGE" >> $GITHUB_OUTPUT
                  echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
                  echo "dated=$DATE_TAG-$SHORT_SHA" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ steps.version.outputs.VERSION }}
                      ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
                      ${{ steps.image.outputs.name }}:${{ steps.image.outputs.dated }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-render:
        name: Deploy to Render
        runs-on: ubuntu-latest
        needs: [build]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        steps:
            # El deploy hook no acepta variables de entorno: las del app
            # (NODE_ENV, DB_URL, SUPABASE_URL/PUBLISHABLE_KEY/SECRET_KEY/
            # STORAGE_BUCKET, ABLY_API_KEY, TRUST_PROXY=1, CORS_ORIGINS)
            # se definen una vez en el Dashboard de Render > Service >
            # Environment. Este job solo dispara el redeploy.
            - name: Trigger Render deploy hook
              env:
                  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
              run: |
                  HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK}")
                  if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
                      echo "::error::Render deploy hook responded HTTP ${HTTP_CODE}"
                      exit 1
                  fi
                  echo "Render deploy triggered successfully (HTTP ${HTTP_CODE})."

    security:
        name: Security Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Run npm audit
              run: npm audit --audit-level=high
