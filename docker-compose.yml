networks:
    back-end:
        driver: bridge
        name: back-end
    front-end:
        driver: bridge
        name: front-end

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: commons-marketplace-app
        restart: unless-stopped

        env_file:
            - .env

        expose:
            - '3000'

        healthcheck:
            test:
                ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'

        networks:
            - back-end
            - front-end

    nginx:
        image: docker.io/library/nginx:alpine
        container_name: commons-marketplace-nginx
        restart: unless-stopped

        ports:
            - '8444:443'

        environment:
            UPSTREAM_HOST: commons-marketplace-app
            UPSTREAM_PORT: '3000'

        volumes:
            - ./nginx/conf/templates:/etc/nginx/templates:ro
            - ./nginx/certs:/etc/nginx/certs:ro

        depends_on:
            app:
                condition: service_healthy

        networks:
            - back-end

        logging:
            driver: 'json-file'
            options:
                max-size: '10m'
                max-file: '3'