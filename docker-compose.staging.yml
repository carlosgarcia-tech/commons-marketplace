version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: runner
        ports:
            - '3000:3000'
        env_file:
            - .env.staging
        environment:
            - NODE_ENV=staging
        depends_on:
            mongodb:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - backend

    mongodb:
        image: mongo:7
        # Internal network only; staging mirrors production hardening.
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
        volumes:
            - mongodb-data:/data/db
        restart: unless-stopped
        networks:
            - backend

networks:
    backend:
        driver: bridge

volumes:
    mongodb-data:
